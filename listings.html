<script id="oc-search-js">
/* 매물 검색 - 화면에 있는 매물 목록을 입력한 글자로 걸러냅니다 */
(function () {
  var input = document.getElementById('oc-search');
  var list  = document.getElementById('oc-list');
  var empty = document.getElementById('oc-search-empty');
  if (!input || !list) return;

  function cardList() {
    var out = [];
    for (var i = 0; i < list.children.length; i++) {
      if (list.children[i].nodeType === 1) out.push(list.children[i]);
    }
    return out;
  }

  function normalize(t) {
    return (t || '').toLowerCase().replace(/\s+/g, '');
  }

  function filter() {
    var q = normalize(input.value);
    var shown = 0;

    cardList().forEach(function (card) {
      var hit = q === '' || normalize(card.innerText).indexOf(q) !== -1;
      card.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });

    if (empty) empty.classList.toggle('hidden', shown > 0);
  }

  input.addEventListener('input', filter);
  document.addEventListener('oc:list-rendered', filter);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); filter(); input.blur(); }
    if (e.key === 'Escape') { input.value = ''; filter(); }
  });
})();
</script>
