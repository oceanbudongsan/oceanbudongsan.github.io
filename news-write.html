      <label class="font-label-sm text-label-sm text-on-surface-variant font-bold block mb-1">제목</label>

      </div>
      <input id="post-image-url" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-primary focus:outline-none" placeholder="https://images.unsplash.com/... 또는 외부 이미지 URL">
    </div>

    <!-- Toolbar & Editor -->
    <div>
      <label class="font-label-sm text-label-sm text-on-surface-variant font-bold block mb-2">본문 내용</label>
      <!-- Editor Toolbar -->
      <div class="flex items-center gap-1 border-b border-surface-variant pb-2 px-2 bg-gray-50/80 rounded-t-xl">

        <button type="button" onclick="formatDoc('italic')" class="text-on-surface-variant hover:text-primary p-2 rounded-lg hover:bg-surface-container" title="기울임"><span class="material-symbols-outlined text-sm">format_italic</span></button>
        <button type="button" onclick="formatDoc('underline')" class="text-on-surface-variant hover:text-primary p-2 rounded-lg hover:bg-surface-container" title="밑줄"><span class="material-symbols-outlined text-sm">format_underlined</span></button>

        <button type="button" onclick="insertBulletList()" class="text-on-surface-variant hover:text-primary p-2 rounded-lg hover:bg-surface-container" title="목록"><span class="material-symbols-outlined text-sm">format_list_bulleted</span></button>

<!-- Scripts -->
<script src="js/github-db.js"></script>
<script src="js/photo-upload.js"></script>
<script src="js/ocean-motion.js"></script>
<script>
  let selectedCategory = '뉴스';
  let editPostId = null;

  document.addEventListener('DOMContentLoaded', async () => {
    // Check URL params for edit mode
    const urlParams = new URLSearchParams(window.location.search);
    editPostId = urlParams.get('id');

    setupCategorySelector();
    setupSampleImage();

    if (editPostId) {
      document.getElementById('page-heading').textContent = '부동산소식 글 수정';
      document.getElementById('btn-text').textContent = '게시글 수정 완료';
      await loadExistingPost(editPostId);
    }

    document.getElementById('news-form').addEventListener('submit', handleSubmit);
  });

  function setupCategorySelector() {
    const btns = document.querySelectorAll('.oc-cat-btn');
    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        btns.forEach(b => b.className = 'oc-cat-btn flex-1 px-4 py-2.5 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-high transition-all');
        btn.className = 'oc-cat-btn flex-1 px-4 py-2.5 rounded-lg font-label-md text-label-md bg-primary text-on-primary shadow-sm transition-all';
        selectedCategory = btn.getAttribute('data-cat');
      });
    });
  }

  function setCategory(cat) {
    selectedCategory = cat;
    const btns = document.querySelectorAll('.oc-cat-btn');
    btns.forEach(btn => {
      if (btn.getAttribute('data-cat') === cat) {
        btn.className = 'oc-cat-btn flex-1 px-4 py-2.5 rounded-lg font-label-md text-label-md bg-primary text-on-primary shadow-sm transition-all';
      } else {
        btn.className = 'oc-cat-btn flex-1 px-4 py-2.5 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-high transition-all';
      }
    });
  }

  function setupSampleImage() {
    const sampleBtn = document.getElementById('use-sample-img-btn');
    if (sampleBtn) {
      sampleBtn.addEventListener('click', () => {
        const samples = [
          'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80'
        ];
        const pick = samples[Math.floor(Math.random() * samples.length)];
        document.getElementById('post-image-url').value = pick;
        OceanMotion.showToast('샘플 이미지 URL이 입력되었습니다.');
      });
    }
  }

  async function loadExistingPost(id) {
    const post = await OceanDB.getPostById(id);
    if (!post) {
      alert('수정할 게시글을 찾을 수 없습니다.');
      window.location.href = 'news.html';
      return;
    }

    document.getElementById('post-title').value = post.title || '';
    document.getElementById('post-image-url').value = post.imageUrl || '';
    document.getElementById('post-body').value = post.content || post.summary || '';
    setCategory(post.category || '뉴스');
  }

  async function handleSubmit(e) {
    e.preventDefault();

    const title = document.getElementById('post-title').value.trim();
    let imageUrl = document.getElementById('post-image-url').value.trim();
    const content = document.getElementById('post-body').value.trim();

    /* 대표 이미지를 비워두셨으면 본문 첫 사진을 대표로 씁니다 */
    if (!imageUrl) {
      const first = content.match(/<img[^>]+src=["']([^"']+)["']/i);
      if (first) imageUrl = first[1];
    }

    if (!title || !content) {
      alert('제목과 본문 내용을 입력해주세요.');
      return;
    }

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    document.getElementById('btn-text').textContent = '저장 중...';

    OceanMotion.showToast('게시글 데이터를 커밋 저장하고 있습니다...', 'info');

    const postData = {
      id: editPostId,
      title: title,
      category: selectedCategory,
      imageUrl: imageUrl,
      content: content
    };

    const res = await OceanDB.savePost(postData);

    if (res.success) {
      const msg = res.mode === 'github' ? '🟢 GitHub 저장소에 성공적으로 커밋되었습니다!' : '성공적으로 저장되었습니다 (로컬 저장소).';
      OceanMotion.showToast(msg, 'success');
      setTimeout(() => {
        window.location.href = 'news.html';
      }, 1200);
    } else {
      alert('저장 실패: ' + (res.error || '다시 시도해주세요.'));
      submitBtn.disabled = false;
      document.getElementById('btn-text').textContent = editPostId ? '게시글 수정 완료' : '게시글 등록하기';
    }
  }

  // Formatting toolbar helpers
  window.formatDoc = function(cmd) {
    const area = document.getElementById('post-body');
    const start = area.selectionStart;
    const end = area.selectionEnd;
    const sel = area.value.substring(start, end);
    let replacement = '';
    if (cmd === 'bold') replacement = `<strong>${sel || '텍스트'}</strong>`;
    if (cmd === 'italic') replacement = `<em>${sel || '텍스트'}</em>`;
    if (cmd === 'underline') replacement = `<u>${sel || '텍스트'}</u>`;
    
    area.value = area.value.substring(0, start) + replacement + area.value.substring(end);
  };

  window.insertParagraph = function() {
    const area = document.getElementById('post-body');
    area.value += '\n<p>새로운 단락 내용을 작성하세요.</p>\n';
  };

  window.insertBulletList = function() {
    const area = document.getElementById('post-body');
    area.value += '\n<ul>\n  <li>항목 1</li>\n  <li>항목 2</li>\n</ul>\n';
  };
</script>




<template id="oc-actions">
<a href="news.html" class="px-3.5 py-1.5 rounded-full text-xs font-bold text-gray-600 hover:bg-gray-100 transition-colors flex items-center gap-1">
  <span class="material-symbols-outlined text-sm">arrow_back</span> 목록으로
</a>
</template>
<script>
  /* 본문에 사진 넣기 - 고른 사진이 커서 자리에 들어갑니다 */
  (function () {
    var btn = document.getElementById('post-photo-btn');
    var file = document.getElementById('post-photo-file');
    var body = document.getElementById('post-body');
    if (btn && file && body && typeof OceanPhoto !== 'undefined') {
      btn.addEventListener('click', function () { file.click(); });
      OceanPhoto.attach(file, body, document.getElementById('post-photo-status'), { mode: 'insert' });

      /* 본문에 사진이 들어오면 대표 이미지가 비어 있을 때 첫 사진으로 채웁니다 */
      var cover = document.getElementById('post-image-url');
      body.addEventListener('input', function () {
        if (cover && !cover.value.trim()) {
          var m = body.value.match(/<img[^>]+src=["']([^"']+)["']/i);
          if (m) {
            cover.value = m[1];
            cover.style.background = '#eef5ff';
          }
        }
      });
      var watch = setInterval(function () {
        if (cover && !cover.value.trim()) {
          var m = body.value.match(/<img[^>]+src=["']([^"']+)["']/i);
          if (m) { cover.value = m[1]; cover.style.background = '#eef5ff'; }
        }
      }, 1500);
      window.addEventListener('beforeunload', function () { clearInterval(watch); });
    }
  })();
</script>
