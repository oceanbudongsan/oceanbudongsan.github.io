<body class="bg-canvas text-foreground antialiased selection:bg-primary selection:text-on-primary min-h-screen flex flex-col">





<!-- Main Content -->
<main class="flex-grow w-full max-w-7xl mx-auto px-margin-page py-8 md:py-14 flex flex-col items-center">
<!-- Page Header -->
<div class="w-full max-w-4xl mb-6 flex flex-col md:flex-row md:items-end justify-between gap-4 oc-reveal">
  <div>
    <div class="flex items-center gap-3 mb-2">
      <h1 class="font-headline-lg text-headline-lg text-on-surface">부동산소식</h1>
    </div>
    <p class="font-body-md text-body-md text-body-text">오션부동산의 최신 소식, 공지사항 및 유용한 지역 정보를 확인하세요.</p>
  </div>
</div>

<!-- 소식 읽기 (같은 페이지 안에서 열립니다) -->
<div id="post-detail-modal" class="hidden w-full max-w-4xl mb-6">
  <div class="bg-white rounded-2xl w-full p-6 md:p-8 shadow-sm relative border border-gray-100">
    <button id="modal-close-btn" class="absolute top-5 right-5 text-gray-400 hover:text-gray-700 p-1.5 rounded-full hover:bg-gray-100 transition-colors" title="목록으로">
      <span class="material-symbols-outlined">close</span>
    </button>

    <button onclick="closePostDetail()" class="mb-5 inline-flex items-center gap-1 text-sm font-semibold text-gray-500 hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-base">arrow_back</span> 목록으로
    </button>

    <div id="modal-content">
      <!-- Dynamic Content -->
    </div>
  </div>
</div>

<!-- Search & Filter Controls -->
<div class="oc-list-view w-full max-w-4xl mb-6 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 oc-reveal oc-delay-1">
  <!-- Filter Tabs -->
  <div class="flex overflow-x-auto pb-1 scrollbar-hide space-x-2 border-b border-outline-variant/40" id="category-tabs">
    <button data-cat="전체" class="oc-tab-btn px-4 py-2 font-label-md text-label-md text-primary border-b-2 border-primary whitespace-nowrap transition-colors">전체</button>
    <button data-cat="뉴스" class="oc-tab-btn px-4 py-2 font-label-md text-label-md text-body-text hover:text-primary transition-colors whitespace-nowrap">뉴스</button>
    <button data-cat="공지" class="oc-tab-btn px-4 py-2 font-label-md text-label-md text-body-text hover:text-primary transition-colors whitespace-nowrap">공지</button>
    <button data-cat="지역정보" class="oc-tab-btn px-4 py-2 font-label-md text-label-md text-body-text hover:text-primary transition-colors whitespace-nowrap">지역정보</button>
  </div>

  <!-- Search Input -->
  <div class="relative w-full sm:w-72">
    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">search</span>
    <input type="text" id="news-search-input" placeholder="소식 제목 또는 내용 검색..." class="w-full pl-9 pr-4 py-2 text-sm bg-white rounded-xl border border-gray-200 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm">
  </div>
</div>

<!-- Post List Container -->
<div id="posts-container" class="oc-list-view w-full max-w-4xl flex flex-col space-y-4 oc-reveal oc-delay-2">
  <!-- Dynamic Posts Rendered Here -->
  <div class="py-12 text-center text-gray-400 font-body-md">게시글을 불러오는 중입니다...</div>
</div>
</main>









<!-- Scripts -->
<script src="js/github-db.js"></script>
<script src="js/ocean-motion.js"></script>
<script>
  let allPosts = [];
  let currentCategory = '전체';
  let searchQuery = '';

  document.addEventListener('DOMContentLoaded', async () => {
    await loadPosts();
    setupEvents();
  });

  async function loadPosts() {
    const container = document.getElementById('posts-container');
    try {
      allPosts = await OceanDB.getPosts();
      renderPosts();
    } catch (e) {
      console.error(e);
      container.innerHTML = '<div class="py-8 text-center text-red-500 font-body-md">소식을 불러오는 중 오류가 발생했습니다.</div>';
    }
  }

  function renderPosts() {
    const container = document.getElementById('posts-container');
    
    // Filtering
    let filtered = allPosts.filter(post => {
      const matchCat = (currentCategory === '전체' || post.category === currentCategory);
      const matchSearch = searchQuery === '' || 
        post.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
        (post.summary && post.summary.toLowerCase().includes(searchQuery.toLowerCase()));
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="bg-card rounded-2xl p-12 text-center text-gray-500 flex flex-col items-center justify-center gap-3">
          <span class="material-symbols-outlined text-4xl text-gray-300">find_in_page</span>
          <p class="font-body-md">등록된 소식이 없거나 검색 결과가 없습니다.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = filtered.map(post => {
      let badgeBg = 'bg-sub-blue-bg text-secondary';
      if (post.category === '공지') badgeBg = 'bg-amber-50 text-amber-700 border border-amber-200';
      if (post.category === '지역정보') badgeBg = 'bg-emerald-50 text-emerald-700 border border-emerald-200';

      const imageBlock = post.imageUrl ? `
        <div class="w-full md:w-48 h-36 md:h-auto rounded-xl overflow-hidden flex-shrink-0 relative oc-img-zoom bg-gray-100">
          <img class="w-full h-full object-cover" src="${post.imageUrl}" alt="${post.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=400&q=80'">
        </div>
      ` : '';

      return `
        <article data-id="${post.id}" class="oc-post-card bg-card rounded-2xl p-5 md:p-6 shadow-sm border border-gray-100 flex flex-col md:flex-row gap-5 hover:shadow-md transition-all cursor-pointer group oc-card-interactive">
          <div class="flex-grow flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                  <span class="inline-block px-2.5 py-1 font-label-sm text-label-sm rounded-lg ${badgeBg}">${post.category || '뉴스'}</span>
                  <span class="font-label-sm text-label-sm text-gray-400">${post.date}</span>
                </div>
                <div class="oc-admin-only flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity" onclick="event.stopPropagation();">
                  <button onclick="editPost('${post.id}')" class="p-1 text-gray-400 hover:text-blue-600 rounded" title="글 수정">
                    <span class="material-symbols-outlined text-sm">edit</span>
                  </button>
                  <button onclick="deletePost('${post.id}')" class="p-1 text-gray-400 hover:text-red-600 rounded" title="글 삭제">
                    <span class="material-symbols-outlined text-sm">delete</span>
                  </button>
                </div>
              </div>

              <h2 class="font-headline-md text-headline-md text-on-surface mb-2 group-hover:text-primary transition-colors line-clamp-1">${post.title}</h2>
              <p class="font-body-md text-body-md text-body-text line-clamp-2">${post.summary || ''}</p>
            </div>

            <div class="mt-4 flex items-center justify-between text-body-text border-t border-gray-50 pt-3">
              <div class="flex items-center gap-3 text-xs text-gray-400">
                <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">visibility</span> ${post.views || 0}</span>
                <span>· ${post.author || '오션부동산'}</span>
              </div>
              <span class="text-xs text-primary font-semibold group-hover:translate-x-1 transition-transform flex items-center gap-0.5">
                자세히 읽기 <span class="material-symbols-outlined text-sm">chevron_right</span>
              </span>
            </div>
          </div>
          ${imageBlock}
        </article>
      `;
    }).join('');

    // Attach click listener for post detail modal
    document.querySelectorAll('.oc-post-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.getAttribute('data-id');
        openPostDetail(id);
      });
    });
  }

  function setupEvents() {
    // Category tabs click
    const tabs = document.querySelectorAll('.oc-tab-btn');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => {
          t.className = 'oc-tab-btn px-4 py-2 font-label-md text-label-md text-body-text hover:text-primary transition-colors whitespace-nowrap';
        });
        tab.className = 'oc-tab-btn px-4 py-2 font-label-md text-label-md text-primary border-b-2 border-primary whitespace-nowrap transition-colors';
        currentCategory = tab.getAttribute('data-cat');
        renderPosts();
      });
    });

    // Search input
    const searchInput = document.getElementById('news-search-input');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderPosts();
      });
    }

    // Modal Close
    document.getElementById('modal-close-btn').addEventListener('click', closePostDetail);
  }

  async function openPostDetail(id) {
    const post = await OceanDB.getPostById(id);
    if (!post) return;

    await OceanDB.incrementViews(id);
    post.views = (post.views || 0) + 1;

    const modal = document.getElementById('post-detail-modal');
    const content = document.getElementById('modal-content');

    let imageHtml = post.imageUrl ? `
      <div class="w-full h-64 md:h-80 rounded-2xl overflow-hidden mb-6 bg-gray-100">
        <img src="${post.imageUrl}" alt="${post.title}" class="w-full h-full object-cover">
      </div>
    ` : '';

    content.innerHTML = `
      <div class="flex items-center gap-2 mb-3">
        <span class="px-3 py-1 bg-sub-blue-bg text-secondary text-xs font-bold rounded-lg">${post.category || '뉴스'}</span>
        <span class="text-xs text-gray-400">${post.date}</span>
        <span class="text-xs text-gray-400">· 조회수 ${post.views}</span>
      </div>
      <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-6 leading-snug">${post.title}</h2>
      ${imageHtml}
      <div class="prose max-w-none text-gray-700 font-body-md leading-relaxed space-y-4">
        ${post.content || post.summary || '내용이 없습니다.'}
      </div>

      <div class="mt-8 pt-6 border-t border-gray-100 flex items-center justify-between">
        <div class="oc-admin-only flex items-center gap-2">
          <button onclick="editPost('${post.id}')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-lg transition-colors flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">edit</span> 수정하기
          </button>
          <button onclick="deletePost('${post.id}')" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold rounded-lg transition-colors flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">delete</span> 삭제하기
          </button>
        </div>
        <button onclick="closePostDetail()" class="px-5 py-2 bg-primary text-white text-xs font-bold rounded-lg hover:bg-secondary transition-colors">목록으로</button>
      </div>
    `;

    // 목록을 감추고 읽기 화면을 같은 자리에 보여줍니다
    document.querySelectorAll('.oc-list-view').forEach(el => el.classList.add('hidden'));
    modal.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closePostDetail() {
    const modal = document.getElementById('post-detail-modal');
    modal.classList.add('hidden');
    document.querySelectorAll('.oc-list-view').forEach(el => {
      el.classList.remove('hidden');
      el.classList.add('oc-active');   // 등장 애니메이션이 다시 숨기지 않도록
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.editPost = function(id) {
    window.location.href = `news-write.html?id=${id}`;
  };

  window.deletePost = async function(id) {
    if (!confirm('정말로 이 소식글을 삭제하시겠습니까?')) return;
    
    const res = await OceanDB.deletePost(id);
    if (res.success) {
      OceanMotion.showToast(res.mode === 'github' ? '🟢 GitHub 저장소에서 게시글이 삭제되었습니다.' : '게시글이 삭제되었습니다.', 'success');
      closePostDetail();
      await loadPosts();
    } else {
      alert('삭제 중 오류가 발생했습니다: ' + (res.error || res.message));
    }
  };
</script>
