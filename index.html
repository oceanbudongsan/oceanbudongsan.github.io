  <button data-deal="매매" class="oc-main-cat-btn whitespace-nowrap px-6 py-3 rounded-full bg-surface text-on-surface-variant border border-outline-variant font-label-md text-label-md hover:bg-surface-container transition-all">매매</button>
  <button data-deal="전세" class="oc-main-cat-btn whitespace-nowrap px-6 py-3 rounded-full bg-surface text-on-surface-variant border border-outline-variant font-label-md text-label-md hover:bg-surface-container transition-all">전세</button>
  <button data-deal="월세" class="oc-main-cat-btn whitespace-nowrap px-6 py-3 rounded-full bg-surface text-on-surface-variant border border-outline-variant font-label-md text-label-md hover:bg-surface-container transition-all">월세</button>

<section id="complex-sections" class="flex flex-col gap-10 oc-reveal oc-delay-2"></section>

<!-- 전체 보기 -->
<a href="listings.html" id="see-all-btn"
   class="block w-full text-center bg-gray-900 text-white font-label-lg text-label-lg rounded-2xl py-5 hover:bg-gray-800 transition-colors shadow-sm oc-reveal oc-delay-2">
  전체 매물 보러 가기 →
</a>

<!-- Recent News Teaser Banner Section -->
<section class="bg-card rounded-2xl p-6 md:p-8 shadow-sm border border-gray-100 oc-reveal oc-delay-3">
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary">newspaper</span>
      <h2 class="font-headline-md text-headline-md text-gray-900">최신 부동산소식</h2>
    </div>
    <a href="news.html" class="text-xs font-bold text-primary hover:underline flex items-center gap-0.5">
      전체보기 <span class="material-symbols-outlined text-sm">chevron_right</span>
    </a>
  </div>
  <div id="index-news-preview" class="flex flex-col gap-2">
    <!-- News preview loaded dynamically -->
  </div>
</section>
</main>







<!-- Scripts -->
<script src="js/github-db.js?v=20260908g"></script>
<script src="js/ocean-motion.js?v=20260908g"></script>
<script>
  /* 메인 화면에 앞세울 입주 단지입니다.
     단지명은 홈페이지 매물의 "매물명"과 똑같이 적어야 합니다.
     입주 시기가 바뀌면 이 세 줄만 고치시면 됩니다. */
  const MOVE_IN = [
    { name: '강릉오션시티아이파크',  badge: '입주 중' },
    { name: '강릉자이르네디오션',    badge: '11월 입주 예정' },
    { name: '강릉모아미래도오션리버', badge: '12월 입주 예정' }
  ];

  const PER_SECTION = 3;      /* 단지마다 메인에 보여줄 개수 */
  const URGENT_SLOTS = 6;     /* 급매 영역 칸 수 */
  const MAX_PER_COMPLEX = 2;  /* 급매 영역에서 한 단지가 차지할 수 있는 최대 개수 */

  let allProperties = [];
  let currentDeal = '전체';

  document.addEventListener('DOMContentLoaded', async () => {
    await loadMainData();
    setupMainEvents();
  });

  async function loadMainData() {
    try {
      allProperties = await OceanDB.getProperties();
      renderUrgent();
      renderComplexSections();
      updateSeeAll();

      const posts = await OceanDB.getPosts();
      renderNewsPreview(posts.slice(0, 3));
    } catch (e) {
      console.error(e);
    }
  }

  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* 카드 셋째 줄: 동·층 · 타입 · 면적 을 있는 것만 이어 붙입니다. */
  function metaLine(p) {
    return [p.unitPublic, p.unitType, p.areaShort]
      .map(v => String(v || '').trim()).filter(Boolean).join(' · ');
  }

  function cardHtml(p, hot) {
    const href = 'property-detail.html?id=' + encodeURIComponent(p.id);
    const dealClass = p.type === '전세'
      ? 'bg-sky-100 text-sky-700 border border-sky-200'
      : 'bg-[#3182f6] text-white';
    const pic = p.imageUrl
      ? `<img class="object-cover w-full h-full" src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy">`
      : `<div class="w-full h-full flex flex-col items-center justify-center gap-1 text-on-surface-variant">
           <span class="material-symbols-outlined text-[72px] leading-none opacity-30">apartment</span>
           <span class="text-[13px] font-bold opacity-50">${esc(p.category || '매물')}</span>
         </div>`;
    const meta = metaLine(p);
    return `
      <article class="bg-card rounded-2xl p-padding-container shadow-sm border border-gray-100 flex flex-col gap-2 hover:shadow-lg transition-all relative overflow-hidden oc-card-interactive">
        <a href="${href}" class="relative block w-full h-48 rounded-xl overflow-hidden bg-canvas oc-img-zoom">
          ${pic}
          <div class="absolute top-3 left-3 flex gap-1">
            ${hot ? '<span class="bg-red-600 text-white px-2.5 py-1 rounded-[8px] font-label-sm text-label-sm shadow-sm">급매</span>' : ''}
            <span class="${dealClass} px-2.5 py-1 rounded-[8px] font-label-sm text-label-sm shadow-sm">${esc(p.type || '매매')}</span>
          </div>
        </a>
        ${hot && p.discountText ? `<div class="self-start bg-red-50 text-red-600 font-extrabold text-sm px-2.5 py-1 rounded-lg">${esc(p.discountText)}</div>` : ''}
        <div class="flex flex-col gap-0.5">
          <h2 class="font-headline-md text-headline-md text-on-surface line-clamp-1">
            <a href="${href}" class="hover:text-primary transition-colors">${esc(p.name)}</a>
          </h2>
          <p class="font-body-md text-body-md font-bold text-blue-600 text-[20px]">${esc(p.price)}</p>
          ${meta ? `<p class="text-sm text-gray-500">${esc(meta)}</p>` : ''}
        </div>
        ${hot && p.features ? `<p class="text-on-surface font-bold text-[15px] leading-snug border-t border-gray-100 pt-2">${esc(p.features)}</p>` : ''}
        <a href="${href}" class="w-full h-[48px] mt-auto bg-primary text-on-primary font-label-md text-label-md rounded-xl hover:bg-secondary transition-colors flex items-center justify-center shadow-sm">
          자세히 보기
        </a>
      </article>`;
  }

  /* 급매 고르기
     1) 관리자페이지에서 별표를 켠 매물을 먼저 넣는다
     2) 남은 칸은 할인 큰 순으로 채우되, 한 단지가 화면을 다 차지하지 않도록
        단지당 최대 MAX_PER_COMPLEX 건까지만 넣는다 */
  function pickUrgent() {
    const urgent = allProperties.filter(p => p.urgent);
    const picked = [];
    const used = new Set();
    const perName = {};

    urgent.filter(p => p.featured).forEach(p => {
      if (picked.length >= URGENT_SLOTS) return;
      picked.push(p); used.add(p.id);
      perName[p.name] = (perName[p.name] || 0) + 1;
    });

    urgent
      .filter(p => !used.has(p.id))
      .sort((a, b) => (b.discount || 0) - (a.discount || 0))
      .forEach(p => {
        if (picked.length >= URGENT_SLOTS) return;
        if ((perName[p.name] || 0) >= MAX_PER_COMPLEX) return;
        picked.push(p); used.add(p.id);
        perName[p.name] = (perName[p.name] || 0) + 1;
      });

    return { picked, total: urgent.length };
  }

  function renderUrgent() {
    const box = document.getElementById('urgent-section');
    const grid = document.getElementById('urgent-grid');
    if (!box || !grid) return;

    const { picked, total } = pickUrgent();
    if (!picked.length) { box.hidden = true; return; }

    box.hidden = false;
    document.getElementById('urgent-count').textContent = total + '건';
    grid.innerHTML = picked.map(p => cardHtml(p, true)).join('');
  }

  function renderComplexSections() {
    const box = document.getElementById('complex-sections');
    if (!box) return;

    const html = MOVE_IN.map(item => {
      const rows = allProperties.filter(p =>
        p.name === item.name && (currentDeal === '전체' || p.type === currentDeal));
      if (!rows.length) return '';

      const shown = rows.slice(0, PER_SECTION);
      const rest = rows.length - shown.length;
      const moreHref = 'listings.html?q=' + encodeURIComponent(item.name);
      return `
        <div>
          <div class="flex items-center gap-2 mb-3 flex-wrap">
            <h2 class="font-headline-md text-headline-md text-gray-900">${esc(item.name)}</h2>
            <span class="text-sm font-bold text-primary">${rows.length}건</span>
            <span class="bg-red-50 text-red-600 text-xs font-extrabold px-2.5 py-1 rounded-lg">${esc(item.badge)}</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter-card">
            ${shown.map(p => cardHtml(p, !!p.urgent)).join('')}
          </div>
          ${rest > 0 ? `<a href="${moreHref}" class="mt-4 block text-center border border-dashed border-outline-variant text-primary rounded-xl py-3 font-label-md text-label-md hover:bg-surface-container transition-colors">＋ 더보기 (${rest}건 남음)</a>` : ''}
        </div>`;
    }).join('');

    box.innerHTML = html || `
      <div class="py-12 text-center text-gray-500 bg-white rounded-2xl">
        해당 거래 종류의 매물이 없습니다.
      </div>`;
  }

  function updateSeeAll() {
    const btn = document.getElementById('see-all-btn');
    if (btn) btn.textContent = `전체 매물 ${allProperties.length}건 보러 가기 →`;
  }

  /* 메인 아래쪽 '최신 부동산소식' 칸을 채웁니다.
     글이 없으면 칸 자체를 감춥니다. 제목을 누르면 글마다 따로 만들어 둔
     news/... 페이지로 갑니다 (AI·검색엔진이 읽을 수 있는 진짜 주소입니다). */
  function renderNewsPreview(posts) {
    const box = document.getElementById('index-news-preview');
    if (!box) return;

    const section = box.closest('section');
    const list = Array.isArray(posts) ? posts : [];

    if (!list.length) {
      if (section) section.hidden = true;
      return;
    }
    if (section) section.hidden = false;

    box.innerHTML = list.map(post => {
      let badge = 'bg-sub-blue-bg text-secondary';
      if (post.category === '공지')     badge = 'bg-amber-50 text-amber-700 border border-amber-200';
      if (post.category === '지역정보') badge = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
      if (post.category === 'FAQ')      badge = 'bg-violet-50 text-violet-700 border border-violet-200';

      const href = post.pagePath ? esc(post.pagePath) : 'news.html';

      return `
        <a href="${href}" class="group flex items-center gap-3 py-2.5 px-3 -mx-3 rounded-xl hover:bg-surface-container transition-colors">
          <span class="inline-block px-2 py-0.5 font-label-sm text-label-sm rounded-lg flex-shrink-0 ${badge}">${esc(post.category || '뉴스')}</span>
          <span class="flex-grow min-w-0 font-body-md text-body-md text-on-surface truncate group-hover:text-primary transition-colors">${esc(post.title || '')}</span>
          <span class="font-label-sm text-label-sm text-gray-400 flex-shrink-0 hidden sm:inline">${esc(post.date || '')}</span>
          <span class="material-symbols-outlined text-sm text-gray-300 group-hover:text-primary transition-colors flex-shrink-0">chevron_right</span>
        </a>
      `;
    }).join('');
  }

  function setupMainEvents() {
    const tabs = document.querySelectorAll('.oc-main-cat-btn');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.className = 'oc-main-cat-btn whitespace-nowrap px-6 py-3 rounded-full bg-surface text-on-surface-variant border border-outline-variant font-label-md text-label-md hover:bg-surface-container transition-all');
        tab.className = 'oc-main-cat-btn whitespace-nowrap px-6 py-3 rounded-full bg-primary text-on-primary font-label-md text-label-md shadow-sm transition-all';
        currentDeal = tab.getAttribute('data-deal');
        renderComplexSections();
      });
    });

    /* 위쪽 검색창은 매물찾기 페이지로 넘겨 거기서 찾게 합니다 */
    const searchInput = document.getElementById('main-search-input');
    if (searchInput) {
      searchInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const q = searchInput.value.trim();
        location.href = q ? 'listings.html?q=' + encodeURIComponent(q) : 'listings.html';
      });
    }
  }
</script>




<script src="common.js?v=20260908g"></script>
